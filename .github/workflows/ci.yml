name: CI

# Tests run only when called from Deploy production (push to main).
# They do not run on pull requests or other branches.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  versions:
    name: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Overall, frontend, and backend versions must match
        run: |
          chmod +x scripts/check-versions.sh
          bash scripts/check-versions.sh

  backend-tests:
    name: backend-tests
    needs: versions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest tests -q

  frontend-build:
    name: frontend-build
    needs: versions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck and production build
        run: npm run build
